# Configuración de Render (Blueprint) para el sitio estático de COMERCIACOR
services:
  - type: web
    name: comerciacor
    runtime: static
    # Las páginas ya vienen generadas en la carpeta sitio/; no hay que compilar nada.
    buildCommand: echo "Sitio listo"
    staticPublishPath: ./sitio
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # Direcciones del sitio anterior de GoDaddy, para no perder enlaces ni posicionamiento
      - type: redirect
        source: /computadores
        destination: /tecnologia/
      - type: redirect
        source: /impresoras
        destination: /tecnologia/
      - type: redirect
        source: /terminos-y-condiciones-1
        destination: /terminos-y-condiciones/
